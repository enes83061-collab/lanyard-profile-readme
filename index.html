<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eneswong.7 Profile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            background-color: #0d1117;
            background-image: radial-gradient(circle at center, #161b22 0%, #0d1117 100%);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
        }
        video#bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.45);
        }
        .sound-control {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .sound-control span {
            font-size: 12px;
            font-weight: 600;
            color: #d1d5db;
        }
        .sound-control input[type="range"] {
            width: 80px;
            accent-color: #a855f7;
            cursor: pointer;
        }
        .card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 380px;
            padding: 24px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .avatar-container {
            position: relative;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(168, 85, 247, 0.5);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
        }
        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .user-info h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .badge {
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(168, 85, 247, 0.2);
            color: #d8b4fe;
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 9999px;
        }
        .social-links {
            display: flex;
            gap: 8px;
            width: 100%;
            justify-content: center;
            margin-top: 4px;
        }
        .social-links a {
            flex: 1;
            text-align: center;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.05);
            hover: background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            text-decoration: none;
            transition: all 0.2s;
        }
        .social-links a:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .activity-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 4px;
            display: none; /* Varsayılan gizli, aktivite varsa açılacak */
        }
        .activity-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: rgba(168, 85, 247, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .activity-details {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            text-align: left;
        }
        .activity-name {
            font-size: 12px;
            font-weight: 700;
            color: #e5e7eb;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .activity-state {
            font-size: 11px;
            color: #9ca3af;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <!-- ARKA PLAN VİDEOSU -->
    <video id="bg-video" autoplay loop muted playsinline>
        <source src="/background.mp4" type="video/mp4">
    </video>

    <!-- ARKA PLAN MÜZİĞİ -->
    <audio id="bg-audio" src="/music.mp3" loop></audio>

    <!-- SAĞ ÜST SES KONTROLÜ -->
    <div class="sound-control">
        <span id="volume-text">SES: %50</span>
        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5">
    </div>

    <!-- ORTA KART CONTAINER -->
    <div class="card">
        <!-- DISCORD AVATAR -->
        <div class="avatar-container">
            <img id="user-avatar" src="" alt="Profile Avatar">
        </div>

        <!-- KULLANICI ADI VE BADGE -->
        <div class="user-info">
            <h1>eneswong.7</h1>
            <span class="badge">💎 GUNS</span>
        </div>

        <!-- SOSYAL MEDYA BUTONLARI -->
        <div class="social-links">
            <a href="https://github.com" target="_blank">GitHub</a>
            <a href="https://discord.com" target="_blank">Discord</a>
            <a href="https://steamcommunity.com" target="_blank">Steam</a>
        </div>

        <!-- DİSCORD AKTİVİTE KARTI -->
        <div id="activity-box" class="activity-card">
            <div class="activity-icon">🎮</div>
            <div class="activity-details">
                <span id="activity-name" class="activity-name">Oyun</span>
                <span id="activity-state" class="activity-state">Aktif</span>
            </div>
        </div>
    </div>

    <script>
        const DISCORD_ID = '1532683555631665166';
        
        // Müzik ve Ses Kontrolü
        const audio = document.getElementById('bg-audio');
        const volumeSlider = document.getElementById('volume-slider');
        const volumeText = document.getElementById('volume-text');

        // Kullanıcı ekrana ilk tıkladığında müziği başlat (Tarayıcı engeline takılmamak için)
        document.body.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().catch(() => {});
            }
        }, { once: true });

        volumeSlider.addEventListener('input', (e) => {
            const vol = parseFloat(e.target.value);
            audio.volume = vol;
            volumeText.innerText = `SES: %${Math.round(vol * 100)}`;
        });

        // Lanyard API ile Discord Durumu Çekme
        async function fetchLanyard() {
            try {
                const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
                const response = await res.json();

                if (response.success && response.data) {
                    const data = response.data;
                    
                    // Avatar Ayarlama
                    const user = data.discord_user;
                    const avatarImg = document.getElementById('user-avatar');
                    if (user.avatar) {
                        const ext = user.avatar.startsWith('a_') ? 'gif' : 'png';
                        avatarImg.src = `https://cdn.discordapp.com/avatars/${DISCORD_ID}/${user.avatar}.${ext}?size=256`;
                    } else {
                        avatarImg.src = `https://unavatar.io/discord/${DISCORD_ID}`;
                    }

                    // Aktivite (Oynadığı Oyun vb.) Kontrolü
                    const activityBox = document.getElementById('activity-box');
                    const activityName = document.getElementById('activity-name');
                    const activityState = document.getElementById('activity-state');

                    if (data.activities && data.activities.length > 0) {
                        const primaryActivity = data.activities[0];
                        activityName.innerText = primaryActivity.name;
                        activityState.innerText = primaryActivity.details || primaryActivity.state || 'Aktif';
                        activityBox.style.display = 'flex';
                    } else {
                        activityBox.style.display = 'none';
                    }
                }
            } catch (err) {
                console.error('Lanyard yüklenemedi:', err);
                document.getElementById('user-avatar').src = `https://unavatar.io/discord/${DISCORD_ID}`;
            }
        }

        fetchLanyard();
        setInterval(fetchLanyard, 5000);
    </script>
</body>
</html>
